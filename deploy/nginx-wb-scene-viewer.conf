# Nginx location blocks for wb-scene-viewer at hcpd.johnflournoy.science/viewer
#
# DO NOT install this as a standalone server block — hcpd.johnflournoy.science
# already has a server block at /etc/nginx/sites-enabled/hcpd.
#
# Instead, copy the three location blocks below into the existing 443 server
# block in /etc/nginx/sites-enabled/hcpd, then reload nginx:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Key points:
#   - ^~ on /api/ and /viewer/ prevents the regex cache block from intercepting
#     .js/.css files before the proxy can handle them
#   - proxy_pass trailing slash on /viewer/ strips the prefix before uvicorn
#   - /api/ is proxied separately because fetch() calls use absolute /api/ paths

    location /viewer {
        return 301 /viewer/;
    }

    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:8421/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  X-Data-Min;
        proxy_pass_header  X-Data-Max;
    }

    location ^~ /viewer/ {
        proxy_pass         http://127.0.0.1:8421/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout         120s;
        proxy_send_timeout         120s;
        proxy_buffer_size          16k;
        proxy_buffers              8 32k;
        proxy_busy_buffers_size    64k;

        proxy_pass_header  X-Data-Min;
        proxy_pass_header  X-Data-Max;
    }
